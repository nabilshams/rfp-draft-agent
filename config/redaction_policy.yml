# Redaction Policy Configuration
# ─────────────────────────────────────────────────────────
# Each rule has:
#   name         – unique identifier for logging
#   pattern      – Python regex
#   replacement  – what to substitute
#   enabled      – toggle on/off without removing the rule
#   ignore_case  – match case-insensitively (default: true)
#
# Rules run top to bottom, so put the more specific rule first
# (international phone numbers before national ones, for example).
#
# Customer names are NOT listed here by default: this repository is public,
# so a list committed here would publish the names it is meant to protect.
# Set REDACTION_CUSTOMER_NAMES (names separated by ";") in the environment
# instead (`azd env set REDACTION_CUSTOMER_NAMES "Contoso;Fabrikam Ltd"`).
# `customer_names` below is for private forks only.
# ─────────────────────────────────────────────────────────

rules:
  # ── Pricing / financial ──────────────────────────────
  - name: currency_usd
    pattern: '\$\s?\d[\d,]*\.?\d{0,2}\b'
    replacement: "[REDACTED-PRICE]"
    enabled: true

  - name: currency_eur
    pattern: '€\s?\d[\d,]*\.?\d{0,2}\b'
    replacement: "[REDACTED-PRICE]"
    enabled: true

  - name: currency_gbp
    pattern: '£\s?\d[\d,]*\.?\d{0,2}\b'
    replacement: "[REDACTED-PRICE]"
    enabled: true

  - name: currency_words
    pattern: '\b\d[\d,]*\.?\d{0,2}\s?(USD|EUR|GBP|CAD|AUD)\b'
    replacement: "[REDACTED-PRICE]"
    enabled: true

  # ── PII: email ───────────────────────────────────────
  - name: email
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    replacement: "[REDACTED-EMAIL]"
    enabled: true

  # ── PII: phone numbers ──────────────────────────────
  # International first so the leading "+" is removed with the number.
  - name: phone_intl
    pattern: '\+\d{1,3}[-.\s]?\d{2,4}[-.\s]?\d{3,4}[-.\s]?\d{3,4}\b'
    replacement: "[REDACTED-PHONE]"
    enabled: true

  # Needs separators or parentheses, so plain 10-digit quantities ("1234567890 requests") are left alone.
  - name: phone_us
    pattern: '(?<![\w.])(?:\+?1[-.\s]?)?(?:\(\d{3}\)[-.\s]?|\d{3}[-.\s])\d{3}[-.\s]\d{4}(?!\d)'
    replacement: "[REDACTED-PHONE]"
    enabled: true

  # Numbers without separators are only treated as phone numbers when labelled.
  - name: phone_labelled
    pattern: '\b(?:tel|telephone|phone|mobile|cell|fax)\b[:\s#.-]{0,4}\+?\(?\d[\d\s().-]{7,18}\d'
    replacement: "[REDACTED-PHONE]"
    enabled: true

  # ── PII: SSN / national IDs ─────────────────────────
  - name: ssn_us
    pattern: '\b\d{3}-\d{2}-\d{4}\b'
    replacement: "[REDACTED-SSN]"
    enabled: true

  # One or two capital letters followed by 6-9 digits (passport-style). Case-sensitive.
  - name: national_id_generic
    pattern: '\b[A-Z]{1,2}\d{6,9}\b'
    replacement: "[REDACTED-ID]"
    ignore_case: false
    enabled: true

  # ── PII: street addresses ───────────────────────────
  # Needs a capitalised street name ("10 Downing Street"), so "50 beds supervised by Dr." is left alone.
  - name: street_address
    pattern: '\b\d{1,5}\s+(?:[A-Z][A-Za-z.''-]*\s+){1,3}(?:Street|St|Avenue|Ave|Boulevard|Blvd|Road|Rd|Drive|Dr|Lane|Ln|Way|Court|Ct|Place|Pl)\b'
    replacement: "[REDACTED-ADDRESS]"
    ignore_case: false
    enabled: true

  # ── Banking info ─────────────────────────────────────
  - name: iban
    pattern: '\b[A-Z]{2}\d{2}\s?[\dA-Z]{4}\s?[\dA-Z]{4}\s?[\dA-Z]{4}\s?[\dA-Z]{0,4}\s?[\dA-Z]{0,4}\b'
    replacement: "[REDACTED-IBAN]"
    ignore_case: false
    enabled: true

  - name: credit_card
    pattern: '\b(?:\d{4}[-\s]?){3}\d{4}\b'
    replacement: "[REDACTED-CC]"
    enabled: true

  # The keyword comes first: "ABA routing number 021000021".
  - name: routing_number
    pattern: '\b(?:routing|ABA)\b[^\n\d]{0,20}\d{9}\b'
    replacement: "[REDACTED-ROUTING]"
    enabled: true

# Customer names to protect (private forks only; see the note at the top).
# Matched case-insensitively as whole words and replaced with [REDACTED-CUSTOMER].
customer_names: []

# Names that may appear in output even though they are listed above, for
# example the customer an RFP response is addressed to.
customer_allowlist: []
