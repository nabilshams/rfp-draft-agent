# Redaction Policy Configuration
# ─────────────────────────────────────────────────────────
# Each rule has:
#   name       – unique identifier for logging
#   pattern    – Python regex (case-insensitive by default)
#   replacement – what to substitute
#   enabled    – toggle on/off without removing the rule
# ─────────────────────────────────────────────────────────

rules:
  # ── Pricing / financial ──────────────────────────────
  - name: currency_usd
    pattern: '\$\s?\d[\d,]*\.?\d{0,2}\b'
    replacement: "[REDACTED-PRICE]"
    enabled: true

  - name: currency_eur
    pattern: '€\s?\d[\d,]*\.?\d{0,2}\b'
    replacement: "[REDACTED-PRICE]"
    enabled: true

  - name: currency_gbp
    pattern: '£\s?\d[\d,]*\.?\d{0,2}\b'
    replacement: "[REDACTED-PRICE]"
    enabled: true

  - name: currency_words
    pattern: '\b\d[\d,]*\.?\d{0,2}\s?(USD|EUR|GBP|CAD|AUD)\b'
    replacement: "[REDACTED-PRICE]"
    enabled: true

  # ── PII: email ───────────────────────────────────────
  - name: email
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
    replacement: "[REDACTED-EMAIL]"
    enabled: true

  # ── PII: phone numbers ──────────────────────────────
  - name: phone_us
    pattern: '\b(\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b'
    replacement: "[REDACTED-PHONE]"
    enabled: true

  - name: phone_intl
    pattern: '\+\d{1,3}[-.\s]?\d{2,4}[-.\s]?\d{3,4}[-.\s]?\d{3,4}\b'
    replacement: "[REDACTED-PHONE]"
    enabled: true

  # ── PII: SSN / national IDs ─────────────────────────
  - name: ssn_us
    pattern: '\b\d{3}-\d{2}-\d{4}\b'
    replacement: "[REDACTED-SSN]"
    enabled: true

  - name: national_id_generic
    pattern: '\b[A-Z]{1,2}\d{6,9}\b'
    replacement: "[REDACTED-ID]"
    enabled: true

  # ── PII: street addresses ───────────────────────────
  - name: street_address
    pattern: '\b\d{1,5}\s[\w\s]{2,30}(Street|St|Avenue|Ave|Boulevard|Blvd|Road|Rd|Drive|Dr|Lane|Ln|Way|Court|Ct|Place|Pl)\.?\b'
    replacement: "[REDACTED-ADDRESS]"
    enabled: true

  # ── Banking info ─────────────────────────────────────
  - name: iban
    pattern: '\b[A-Z]{2}\d{2}\s?[\dA-Z]{4}\s?[\dA-Z]{4}\s?[\dA-Z]{4}\s?[\dA-Z]{0,4}\s?[\dA-Z]{0,4}\b'
    replacement: "[REDACTED-IBAN]"
    enabled: true

  - name: credit_card
    pattern: '\b(?:\d{4}[-\s]?){3}\d{4}\b'
    replacement: "[REDACTED-CC]"
    enabled: true

  - name: routing_number
    pattern: '\b\d{9}\b(?=.*(?:routing|ABA))'
    replacement: "[REDACTED-ROUTING]"
    enabled: true

# Customer-name allow-list: names listed here are
# permitted in output; all other detected org names
# get flagged as sensitive.
customer_allowlist: []
