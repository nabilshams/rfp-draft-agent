version: "3.9"

services:
  # ── Azurite (local Azure Storage emulator) ─────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000:10000"  # Blob
      - "10001:10001"  # Queue
      - "10002:10002"  # Table
    volumes:
      - azurite-data:/data

  # ── RFP Draft Agent ────────────────────────────────
  rfp-agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AZURE_STORAGE_ACCOUNT_URL=http://azurite:10000/devstoreaccount1
      - AUTH_MODE=disabled
    depends_on:
      - azurite

volumes:
  azurite-data:
