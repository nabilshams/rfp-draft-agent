name: Deploy

# Manual only: a deployment changes billable Azure resources, so it never runs unattended.
# One-time setup (creates the federated credential and repository variables; no secrets are stored):
#   azd pipeline config --provider github
# or set the variables by hand: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_ENV_NAME,
# AZURE_LOCATION, plus optional AUTH_MODE, ENTRA_CLIENT_ID, ENTRA_TENANT_ID, ADMIN_OIDS, ALERT_EMAIL.
# The Entra client secret (ENTRA_CLIENT_SECRET) is a repository *secret*, needed only when AUTH_MODE=easyauth.
# See "Continuous deployment" in the README.

on:
  workflow_dispatch:
    inputs:
      provision:
        description: Also run azd provision (infrastructure changes)
        type: boolean
        default: false

permissions:
  id-token: write # OIDC token for azure/login
  contents: read

concurrency:
  group: deploy-${{ vars.AZURE_ENV_NAME }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff
      - run: ruff check app/ tests/
      - run: pytest tests/ -q --cov=app

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production # add required reviewers to this environment in the repository settings
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Sign in (OIDC)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Select the environment
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt || true
          azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          for name in AUTH_MODE ENTRA_CLIENT_ID ENTRA_TENANT_ID ADMIN_OIDS ALERT_EMAIL ALLOWED_IP_RANGES; do
            value="${!name}"
            [ -n "$value" ] && azd env set "$name" "$value"
          done
          [ -n "$ENTRA_CLIENT_SECRET" ] && azd env set ENTRA_CLIENT_SECRET "$ENTRA_CLIENT_SECRET"
          exit 0
        env:
          AUTH_MODE: ${{ vars.AUTH_MODE }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ADMIN_OIDS: ${{ vars.ADMIN_OIDS }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          ALLOWED_IP_RANGES: ${{ vars.ALLOWED_IP_RANGES }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}

      - name: Provision infrastructure
        if: ${{ inputs.provision }}
        run: azd provision --no-prompt

      - name: Build and deploy the app
        run: azd deploy --no-prompt

      - name: Check the deployment
        run: |
          url=$(azd env get-value SERVICE_API_ENDPOINT_URL)
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "The app did not report healthy at $url/health" >&2
          exit 1
