name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Lint with Ruff
        run: ruff check app/ tests/

      - name: Run unit tests
        env:
          # Provide minimal env vars so Settings can be instantiated in tests
          FOUNDRY_PROJECT_ENDPOINT: https://test.services.ai.azure.com
          AZURE_AI_SEARCH_CONNECTION_NAME: test-search
          AZURE_STORAGE_ACCOUNT_URL: https://teststorage.blob.core.windows.net
          AUTH_MODE: disabled
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rfp-draft-agent:ci .
