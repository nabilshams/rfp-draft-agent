[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rfp-draft-agent"
version = "0.1.0"
description = "RFP Response Agent – Azure AI Foundry code-first agent grounded on Azure AI Search"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-projects>=1.0.0b5",
    "azure-ai-agents>=1.1.0",
    "azure-ai-inference>=1.0.0b7",
    "azure-identity>=1.19.0",
    "azure-search-documents>=11.6.0b8",
    "azure-storage-blob>=12.24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "pypdf2>=3.0.1",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "azure-monitor-opentelemetry>=1.6.4",
    "azure-monitor-opentelemetry-exporter>=1.0.0b31",
    "pyjwt[crypto]>=2.10.0",
    "cryptography>=44.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

# Explicit rule set so lint results don't change when Ruff changes its defaults.
# ASYNC flags blocking calls (e.g. time.sleep, sync SDK I/O) inside async functions.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
